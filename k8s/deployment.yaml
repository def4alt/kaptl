apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaptl
  namespace: kaptl
  labels:
    app: kaptl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaptl
  template:
    metadata:
      labels:
        app: kaptl
    spec:
      containers:
        - name: bot
          image: ghcr.io/def4alt/kaptl:latest
          imagePullPolicy: Always
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kaptl-bot-secrets
                  key: telegram-bot-token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kaptl-bot-secrets
                  key: database-url
            - name: ALLOWED_TELEGRAM_ID
              valueFrom:
                secretKeyRef:
                  name: kaptl-bot-secrets
                  key: allowed-telegram-id
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - pgrep
                - kaptl
            initialDelaySeconds: 10
            periodSeconds: 30
